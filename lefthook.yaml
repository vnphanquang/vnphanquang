assert_lefthook_installed: true
min_version: 2.0.0
glob_matcher: doublestar
pre-commit:
  piped: true
  follow: true
  skip:
    - merge
    - rebase
  jobs:
    - name: 1_eslint
      group:
        parallel: true
        jobs:
          - name: vnphanquang.com
            root: sites/vnphanquang.com
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'sites/vnphanquang.com/*.{js,ts,svelte}'
          - name: '@vnphanquang/eslint-config'
            root: packages/eslint-config
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/eslint-config/*.{js,ts}'
          - name: '@vnphanquang/gach'
            root: packages/gach
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/gach/*.{js,ts,svelte}'
          - name: '@vnpahnquang/markdown'
            root: packages/eslint-config
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/markdown/*.{js,ts,svelte}'
          - name: catchall
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: '*.{js,ts}'
    - name: 2_stylelint
      run: pnpm stylelint --fix {staged_files}
      glob: '**/*.{css,svelte}'
      stage_fixed: true
    - name: 3_prettier
      run: pnpm prettier --write {staged_files}
      glob: '**/*.{js,ts,json,md,yaml,svelte}'
      stage_fixed: true
      exclude:
        - pnpm-lock.yaml

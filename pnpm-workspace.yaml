packages:
  - 'packages/*'
  - 'sites/*'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - svelte-md-template
  - remark-enhance-codeblock
  - remark-transform-blockquote
  - '@svelte-put/toc'
  - '@svelte-put/preprocess-external-link'
  - '@sveltejs/kit'
  - '@sveltejs/adapter-node'
  - '@sveltejs/enhanced-img'
  - '@sveltejs/vite-plugin-svelte'
  - 'svelte'
  - 'vite'
